<!DOCTYPE html>
<html lang="en">
    <head>
        <title>EXERCICIO-1</title>
        <!-- <link href="./estilo.css" rel="stylesheet">  -->
        <!-- <script async src="./index.js"></script> -->
    </head>
   <body> 
    <p id="texto-posicion" style="background-color: pink;">elemento que uso de referencia para usar .before</p>
    <p id="segundo-texto-posicion" style="background-color: violet;">elemento que uso de referencia para usar .after</p>
    <button id="boton">Engadir atributo</button>
    <div>
    <input placeholder="Escribir nombre aquí" type="text" id="input" name="Formulario"/>
    <button id="botonEnviar">Enviar</button>
    </div>
    </body>
    <script>
    //APARTADO A
    let paragrafo = document.createElement('p'); //creo elemento
    let referencia = document.querySelector("#texto-posicion") //atrapo o meu <p> do html para posicionar o meu elemento
    paragrafo.innerHTML = "inserto un parágrafo antes do elemento de referencia"; //modifico o elemento
    referencia.before(paragrafo) //posiciono o elemento ANTES do <p> orixinal do html
    //APARTADO B
    let paragrafo2 = document.createElement('p'); 
    let referencia2 = document.querySelector("#segundo-texto-posicion") 
    paragrafo2.innerHTML = "inserto un parágrafo despois do elemento de referencia"; 
    referencia2.after(paragrafo2) //posiciono o elemento DESPOIS do <p> orixinal do html
    //APARTADO C
    let boton = document.querySelector("#boton");
    let textoAtributo = document.createElement('p');
    textoAtributo.setAttribute("class", "estilo-p");
    textoAtributo.innerHTML = "inserto un parágrafo con atributo";
    boton.after(textoAtributo);
    //APARTADO D
    boton.addEventListener ("click", () => {
        console.log("Inserto a etiqueta do apartado C: ", textoAtributo);
    })
    //APARTADO E
    //APARTADO F
    let botonLista = document.createElement('button');
    botonLista.innerHTML = "Boton para lista";
    document.body.append(botonLista);
    botonLista.addEventListener ("click", () =>{
        let listaDesplegable = document.createElement('ol');
        listaDesplegable.innerHTML= `
        <li>Elemento1</li>
        <li>Elemento2</li>
        <li>Elemento3</li>
        <li>Elemento4</li>
        <li>Elemento5 <img src="imaxes/small-button.png" width="60" height="27" id="imaxe"></li>
    	 `;
        document.body.append(listaDesplegable);
        console.log("Contido da lista: ", listaDesplegable)
    })
    //APARTADO G
    let botonEnviar = document.getElementById("botonEnviar");
    let formulario = document.getElementById("input");
    botonEnviar.addEventListener ("click", () =>{
    console.log("Evento para ler o contido: ", input.value);
    let etiquetaP = document.createElement('p');
    etiquetaP.innerHTML = "Este es el nombre introducido: " + input.value;
    formulario.after(etiquetaP);
    })




    </script>
</html>
